name: 'Quality & Test'

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'vite.config.ts'
      - '*.md'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 'Run Quality Check'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      CI: true

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v2

      - name: Cache Vite+ task setup
        uses: actions/cache@v3
        with:
          path: ~/.cache/vite-plus
          key: vp-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            vp-${{ github.job }}-${{ github.ref_name }}-

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: CI Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Shared Packages
        run: pnpm build:shared

      - name: Build Bot
        run: pnpm build:bot

      - name: Run Type Check
        run: pnpm type-check

      - name: Run Format
        run: pnpm format

      - name: Run Lint
        run: pnpm lint
